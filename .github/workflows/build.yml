name: build-installer
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install
        run: pip install -r requirements.txt
      - name: Build EXE
        run: >
          pyinstaller --noconfirm --clean --windowed --name PdfImageEditor
          --icon app.ico --add-data "app.ico;." --version-file version_info.txt
          --hidden-import win32timezone --collect-submodules pdf2docx
          --exclude-module PySide6.QtWebEngineCore --exclude-module PySide6.QtWebEngineWidgets
          --exclude-module PySide6.Qt3DCore --exclude-module PySide6.QtQuick
          --exclude-module PySide6.QtQml --exclude-module PySide6.QtMultimedia
          --exclude-module tkinter pdf_image_editor.py
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build Installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: PdfImageEditor_Setup
          path: dist/PdfImageEditor_Setup_*.exe
